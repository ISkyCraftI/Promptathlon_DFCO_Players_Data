<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Easyfoot · DFCO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Easyfoot — suivi des joueurs, de la charge et du recrutement du DFCO">
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="fonts/manrope-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Applique le thème avant le premier rendu (évite le flash clair -> sombre).
    try {
      var t = localStorage.getItem("ef-theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("app-dark");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
